name: Profile card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d6334a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#d6334a
            dist/card-snake.svg?color_snake=#e8e8ea&color_dots=#16161c,#4a1520,#7a1c2c,#b02a3f,#ff4d6a&color_dot_border=#00000000
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Build profile card
        run: python3 scripts/build_card.py dist/card-snake.svg dist/card.svg
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Deploy to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.MY_GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update profile card [skip ci]"
